name: CI and release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.4', extensions: 'sodium, pdo_sqlite, intl', coverage: none}
      - uses: actions/cache@v4
        with: {path: ~/.composer/cache, key: "composer-${{ hashFiles('composer.lock') }}"}
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/php-cs-fixer fix --dry-run --diff
      - run: vendor/bin/phpstan analyse
      - run: php bin/console doctrine:migrations:migrate -n --env=test
      - run: php bin/phpunit
  build:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          push: true
          tags: ghcr.io/alba84/copypaste:${{ github.ref_name }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: nginx-prod
          push: true
          tags: ghcr.io/alba84/copypaste-nginx:${{ github.ref_name }}
  deploy:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.1
        with: {ssh-private-key: "${{ secrets.DEPLOY_SSH_KEY }}"}
      - name: Trust the production server host key
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Upload deployment files
        run: |
          scp compose.prod.yaml deploy/deploy.sh \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/"
      - name: Deploy immutable release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "cd '${{ secrets.DEPLOY_PATH }}' && chmod 700 deploy.sh && APP_DIR='${{ secrets.DEPLOY_PATH }}' ./deploy.sh '${RELEASE_TAG}'"
