services:
  php:
    image: ghcr.io/alba84/copypaste:${IMAGE_TAG:-latest}
    pull_policy: always
    env_file: .env
    volumes: [paste_data:/app/var/data]
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    mem_limit: 448m
    restart: unless-stopped
  nginx:
    image: ghcr.io/alba84/copypaste-nginx:${IMAGE_TAG:-latest}
    pull_policy: always
    depends_on:
      php:
        condition: service_healthy
    ports: ["127.0.0.1:8080:80"]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    mem_limit: 64m
    restart: unless-stopped
  scheduler:
    image: ghcr.io/alba84/copypaste:${IMAGE_TAG:-latest}
    pull_policy: always
    command: php bin/console messenger:consume scheduler_default --time-limit=3600
    env_file: .env
    volumes: [paste_data:/app/var/data]
    depends_on:
      php:
        condition: service_healthy
    mem_limit: 384m
    restart: unless-stopped
volumes:
  paste_data:
