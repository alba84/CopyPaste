services:
  php:
    build: {context: ., target: dev}
    working_dir: /app
    command: sh -c 'mkdir -p var/data && chown -R www-data:www-data var/data && exec php-fpm'
    environment: {APP_ENV: dev, XDEBUG_MODE: "${XDEBUG_MODE:-off}"}
    volumes: [./:/app]
  nginx:
    image: nginx:alpine
    depends_on: [php]
    ports: ["8080:80"]
    volumes: [./:/app:ro, ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro]
  scheduler:
    build: {context: ., target: dev}
    working_dir: /app
    command: php bin/console messenger:consume scheduler_default --time-limit=3600
    environment: {APP_ENV: dev, XDEBUG_MODE: "off"}
    volumes: [./:/app]
